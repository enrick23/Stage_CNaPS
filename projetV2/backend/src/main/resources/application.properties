# Configuration du module IA (Generation et Reverse Engineering)
# Fournisseur : 'expert' (secours local CNaPS garanti sans Internet), 'gemini', 'ollama', ou 'openai')
dico.ai.provider=expert
dico.ai.api-key=${AI_API_KEY:}
dico.ai.model=
dico.ai.base-url=
dico.ai.timeout-seconds=60
dico.ai.send-source-code=true
dico.ai.max-code-chars=60000

spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false
